name: CI

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: Backend tests [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        distribution: ${{ matrix.distribution || 'temurin' }}
        java-version: "25"
        cache: gradle

    - name: Run backend tests
      run: ./gradlew :app:test --no-daemon

